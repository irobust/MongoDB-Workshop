services:

  mongo1:
    image: mongo:8
    container_name: mongo1
    hostname: mongo1
    command: >
      mongod --replSet rs0 --bind_ip_all
    ports:
      - "27017:27017"

  mongo2:
    image: mongo:8
    container_name: mongo2
    hostname: mongo2
    command: >
      mongod --replSet rs0 --bind_ip_all

  mongo3:
    image: mongo:8
    container_name: mongo3
    hostname: mongo3
    command: >
      mongod --replSet rs0 --bind_ip_all